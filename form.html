<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseTracker | Formulario</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/store.js" defer></script>
    <script src="./js/form.js" defer></script>
  </head>
  <body data-page="form">
    <header class="site-header">
      <div class="container header-row">
        <a class="brand" href="./index.html">CourseTracker</a>
        <nav class="site-nav" aria-label="Principal">
          <a class="nav-link" href="./index.html">Inicio</a>
          <a class="nav-link" href="./courses.html">Cursos</a>
          <a class="nav-link is-active" href="./form.html">Formulario</a>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      <section class="intro-block intro-compact">
        <p class="section-kicker">Edicion local</p>
        <h1 id="form-page-title">Nuevo curso</h1>
        <p class="lead">Formulario separado para crear o editar cursos sin usar modal.</p>
      </section>

      <section class="panel form-panel">
        <form id="course-form" class="course-form">
          <div class="form-grid">
            <label class="field">
              <span>Titulo</span>
              <input name="title" type="text" maxlength="120" required />
            </label>

            <label class="field">
              <span>Instructor</span>
              <input name="instructor" type="text" maxlength="100" required />
            </label>

            <label class="field">
              <span>Plataforma</span>
              <input name="platform" type="text" maxlength="60" required />
            </label>

            <label class="field">
              <span>Categoria</span>
              <select name="category" required>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Data">Data</option>
                <option value="Design">Design</option>
                <option value="Productividad">Productividad</option>
              </select>
            </label>

            <label class="field">
              <span>Nivel</span>
              <select name="level" required>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </label>

            <label class="field">
              <span>Precio</span>
              <input name="price" type="number" min="0" step="0.01" required />
            </label>

            <label class="field">
              <span>Horas</span>
              <input name="durationHours" type="number" min="1" step="1" required />
            </label>

            <label class="field">
              <span>Lecciones</span>
              <input name="lessons" type="number" min="1" step="1" required />
            </label>
          </div>

          <label class="field">
            <span>Descripcion</span>
            <textarea name="description" rows="6" maxlength="500" required></textarea>
          </label>

          <div class="form-actions">
            <a class="button button-secondary" id="cancel-link" href="./courses.html">Cancelar</a>
            <button class="button button-primary" type="submit">Guardar curso</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
